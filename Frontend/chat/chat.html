<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#faf9f7">
    <title>Melo — 플레이리스트 채팅</title>
    <link rel="stylesheet" href="chat.css">
    <script src="chat.js" defer></script>
</head>

<body>
    
  <div class="overlay" id="overlay"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="대화 목록">
      <div class="brand"><span class="brand-mark" aria-hidden="true">♫</span> melo <small>STUDIO</small></div>
      <button class="new-chat" id="newChatButton" type="button"><span aria-hidden="true">＋</span> 새 플레이리스트 만들기</button>
      <div class="section-label">나의 대화</div>
      <nav class="conversation-list" id="conversationList" aria-label="저장된 대화"></nav>
      <div class="sidebar-bottom">
        <a class="account-link" href="login.html"><span class="avatar" aria-hidden="true">♪</span> 로그인 페이지 <span style="margin-left:auto" aria-hidden="true">↗</span></a>
        <div class="sidebar-note">현재 대화는 이 브라우저에만 임시 저장됩니다.<br>서버 세션과 DB 연결은 아직 적용되지 않았습니다.</div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <button class="mobile-menu" id="openSidebar" type="button" aria-label="대화 목록 열기">☰</button>
        <div class="header-titles"><div class="eyebrow">YOUR MUSIC, YOUR STORY</div><div class="header-title" id="currentTitle">새 플레이리스트</div></div>
        <div class="header-actions">
          <button type="button" class="soft-button playlist-toggle" id="openPlaylist">♫ 플레이리스트</button>
          <button type="button" class="soft-button delete-button" id="deleteChat">대화 삭제</button>
        </div>
      </header>
      <section class="chat-scroll" id="chatScroll" aria-label="대화 메시지">
        <div class="chat-inner welcome" id="chatContent"></div>
      </section>
      <div class="composer-wrap">
        <form class="composer" id="messageForm">
          <textarea id="messageInput" rows="1" maxlength="2000" placeholder="원하는 분위기나 노래를 말해 주세요..." aria-label="메시지 입력" required></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="메시지 보내기" disabled>➤</button>
        </form>
        <div class="composer-note">Enter 전송 · Shift + Enter 줄바꿈 · 현재는 프론트엔드 미리보기</div>
      </div>
    </main>

    <aside class="playlist-panel" id="playlistPanel" aria-label="현재 플레이리스트">
      <div class="panel-kicker">NOW CURATING</div>
      <div class="panel-title">나의 플레이리스트 <span aria-hidden="true">✦</span></div>
      <div class="playlist-card"><p>MY MIXTAPE</p><h2 id="playlistTitle">새 플레이리스트</h2><span class="track-count" id="trackCount">♫ 0곡 수록</span></div>
      <div class="track-heading"><span>수록된 곡</span><span id="trackCountSmall" style="color:#aaa3b0">0 TRACKS</span></div>
      <div class="track-list" id="trackList"></div>
      <div class="panel-footer">추천 서버가 플레이리스트 데이터를 반환하면 이 영역에 곡이 표시됩니다.</div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
